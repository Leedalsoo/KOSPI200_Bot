<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOSPI200 HFT Emergency Control Panel</title>
  <!-- React, ReactDOM, Babel CDN 로드 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Recharts CDN 로드 (D3 의존성 포함) -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
  <style>
    /* 🛡️ HFT 프리미엄 다크 테마 글로벌 CSS 정의 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0F172A;
      /* Slate 900 */
      color: #F8FAFC;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      padding: 24px;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0F172A;
    }

    ::-webkit-scrollbar-thumb {
      background: #1E293B;
      border-radius: 4px;
      border: 1px solid #334155;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .4;
        transform: scale(0.95);
      }
    }

    @keyframes warnPulse {

      0%,
      100% {
        color: #EF4444;
        text-shadow: 0 0 5px rgba(239, 68, 68, 0.3);
      }

      50% {
        color: #F59E0B;
        text-shadow: 0 0 15px rgba(245, 158, 11, 0.8);
      }
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, memo } = React;
    const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ScatterChart, Scatter, ReferenceLine, ResponsiveContainer, Brush, Cell } = Recharts;


    const MAX_POINTS = 5000;
    const MAX_ORDERS = 50;

    // 천단위 쉼표 포맷팅 유틸 (십만단위 절사 정렬 적용 - 차트용)
    const formatCurrency = (val) => {
      const num = Math.round(Number(val) / 100000) * 100000;
      return (num >= 0 ? "+" : "-") + Math.abs(num).toLocaleString('ko-KR') + "원";
    };

    // 정밀 원화 포맷팅 유틸 (헤더 수치 변동 감시용)
    const formatCurrencyPrecise = (val) => {
      const num = Math.round(Number(val));
      return (num >= 0 ? "+" : "-") + Math.abs(num).toLocaleString('ko-KR') + "원";
    };

    // 가상 경과 시간 포맷터 (**일 **시간 **분)
    const formatElapsedTime = (totalSecs) => {
      if (!totalSecs) return '0일 0시간 0분';
      const days = Math.floor(totalSecs / 86400);
      const remainingSecs = totalSecs % 86400;
      const hours = Math.floor(remainingSecs / 3600);
      const mins = Math.floor((remainingSecs % 3600) / 60);
      return `${days}일 ${hours}시간 ${mins}분`;
    };

    // 소수점 D-Day 만기일시 포맷터
    const formatDDay = (days) => {
      if (days === undefined || days === null) return '';
      const d = Math.floor(days);
      const frac = days - d;
      const hours = Math.round(frac * 24);
      if (d === 0 && hours === 0) return '만기 정산 중';
      return `D-${d}일 ${hours}시간`;
    };

    // ==============================================================================
    // 1. [NEW] 8-Strategy Position Matrix Dashboard
    // ==============================================================================
    // ==============================================================================
    // 1. [NEW] 8-Strategy Master Unified Position & PnL Matrix Dashboard (100% Full Width)
    // ==============================================================================
    const MasterMultiStrategyMatrixDashboard = memo(({ weights, strategyPnL, portfolioOptions, futuresQty }) => {
      const pnlData = strategyPnL || {};
      const options = portfolioOptions || [];

      const getProgressColor = (name) => {
        if (name.includes("Track1")) return "#EF4444";
        if (name.includes("Track2")) return "#F59E0B";
        if (name.includes("Track3")) return "#10B981";
        if (name.includes("Track5") || name.includes("Gap")) return "#06B6D4";
        if (name.includes("Track6") || name.includes("Daily")) return "#EAB308";
        if (name.includes("Track7") || name.includes("Weekly")) return "#8B5CF6";
        if (name.includes("Track8") || name.includes("Monthly")) return "#EC4899";
        return "#3B82F6"; // Track 4
      };

      const getStrategyDescription = (name) => {
        if (name.includes("Track1")) return "🛡️ 100% 방어막 유지 (옵션 1:1 대칭 / 테타 프리미엄 수취)";
        if (name.includes("Track2")) return "🛡️ 90% 마진 헷지 동적 작동 (5틱 휩소 쿨다운 억제 중)";
        if (name.includes("Track3")) return "⛔ [V2 HOLD] 차익 거래 일시 정지 (시뮬레이션 테스트 순도 유지)";
        if (name.includes("Track4")) return "⚔️ 감마 델타 스캘핑 수확 진행 중 (지수 급등락 휩소 환원)";
        if (name.includes("Track5")) return "⚡ 시가 갭 회귀 가변 Z-Score 감시 중 (NORMAL: 1.1 / HIGH_VOL: 1.8)";
        if (name.includes("Track6")) return "🎉 0DTE 당일 옵션 보험 이익 실현 정산 완료 (상시 대기)";
        if (name.includes("Track7")) return "🎉 위클리 롱 스트랭글 동적 익절 완료 (+150% 이상 장중 청산)";
        if (name.includes("Track8")) return "⏳ 월물 초입 DTE 15일 이상 자본 2% 예산 연동 매수";
        return "전략 가동 중";
      };

      const getStatusBadge = (name, weight) => {
        if (name.includes("Track3")) {
          return { label: "HOLD", bg: "rgba(239, 68, 68, 0.15)", color: "#EF4444", border: "#EF4444" };
        }
        if (name.includes("Track6") || name.includes("Track7")) {
          return { label: "COMPLETED", bg: "rgba(139, 92, 246, 0.15)", color: "#A78BFA", border: "#8B5CF6" };
        }
        if (weight > 0) {
          return { label: "ACTIVE", bg: "rgba(16, 185, 129, 0.15)", color: "#10B981", border: "#10B981" };
        }
        return { label: "STANDBY", bg: "rgba(245, 158, 11, 0.15)", color: "#FBBF24", border: "#F59E0B" };
      };

      const renderMiniCol = (colTitle, items) => {
        const buys = items.filter(p => p.side === "BUY");
        const sells = items.filter(p => p.side === "SELL");

        return (
          <div style={{ flex: 1, padding: '2px 4px', borderRight: colTitle !== 'PUT' ? '1px solid #334155' : 'none', display: 'flex', flexDirection: 'column' }}>
            <div style={{ textAlign: 'center', fontWeight: 700, color: '#94A3B8', fontSize: '10px', marginBottom: '2px' }}>{colTitle}</div>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '8px', color: '#64748B', marginBottom: '2px' }}>
              <span style={{ color: '#EF4444' }}>SELL</span>
              <span style={{ color: '#10B981' }}>BUY</span>
            </div>
            <div style={{ display: 'flex', flex: 1, gap: '2px', overflowY: 'auto', maxHeight: '110px' }}>
              <div style={{ flex: 1 }}>
                {sells.map((s, idx) => (
                  <div key={`s-${idx}`} style={{
                    backgroundColor: 'rgba(239,68,68,0.15)',
                    padding: '3px 4px',
                    border: '1px solid #EF4444',
                    borderRadius: '4px',
                    marginBottom: '3px',
                    fontSize: '10px',
                    color: '#F8FAFC',
                    fontFamily: 'monospace'
                  }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                      <span>{s.type === 'FUTURES' ? `F(${s.qty})` : `${s.strike}(${s.qty})`}</span>
                      {s.tag_id && <span style={{ color: '#EF4444', fontSize: '8px', fontWeight: 'bold' }}>🔗#{s.tag_id}</span>}
                    </div>
                    {s.price && <div style={{ fontSize: '8px', color: '#94A3B8', marginTop: '1px' }}>{s.price}P</div>}
                  </div>
                ))}
              </div>
              <div style={{ flex: 1 }}>
                {buys.map((b, idx) => (
                  <div key={`b-${idx}`} style={{
                    backgroundColor: 'rgba(16,185,129,0.15)',
                    padding: '3px 4px',
                    border: '1px solid #10B981',
                    borderRadius: '4px',
                    marginBottom: '3px',
                    fontSize: '10px',
                    color: '#F8FAFC',
                    fontFamily: 'monospace'
                  }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                      <span>{b.type === 'FUTURES' ? `F(${b.qty})` : `${b.strike}(${b.qty})`}</span>
                      {b.tag_id && <span style={{ color: '#10B981', fontSize: '8px', fontWeight: 'bold' }}>🔗#{b.tag_id}</span>}
                    </div>
                    {b.price && <div style={{ fontSize: '8px', color: '#94A3B8', marginTop: '1px' }}>{b.price}P</div>}
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      };

      return (
        <section style={{
          backgroundColor: '#0F172A',
          borderRadius: '16px',
          border: '1px solid #334155',
          padding: '24px',
          marginTop: '24px',
          width: '100%',
          gridColumn: '1 / -1',
          boxShadow: '0 4px 20px rgba(0, 0, 0, 0.25)',
          boxSizing: 'border-box'
        }}>

          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px', borderBottom: '1px solid #334155', paddingBottom: '14px' }}>
            <h2 style={{ fontSize: '16px', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.05em', color: '#F8FAFC', margin: 0, display: 'flex', alignItems: 'center', gap: '8px' }}>
              <span>📊 Multi-Strategy Master Position & PnL Matrix</span>
              <span style={{ fontSize: '11px', color: '#38BDF8', fontWeight: 500, fontFamily: 'monospace' }}>
                (전략별 실시간 누적 손익 · 프로세스 · 선물/옵션 체결 포지션 매트릭스)
              </span>
            </h2>
            <span style={{ fontSize: '11px', color: '#94A3B8', fontFamily: 'monospace', backgroundColor: '#1E293B', padding: '4px 10px', borderRadius: '6px', border: '1px solid #334155' }}>
              8 Tracks Live Synchronized (100% Full Width)
            </span>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(8, 1fr)', gap: '8px', width: '100%' }}>
            {Object.entries(weights || {}).map(([name, val]) => {
              const pnl = pnlData[name] || 0.0;
              const estFee = pnl !== 0 ? Math.min(Math.abs(pnl) * 0.02, 125000) : 0;
              const grossPnL = pnl + estFee;
              const badge = getStatusBadge(name, val);
              const color = getProgressColor(name);
              const desc = getStrategyDescription(name);

              const trackKey = name.split(' ')[0]; // Track1, Track2...
              const trackPositions = (options || []).filter(pos => {
                const s = pos.activeStrategy || '';
                return s.includes(trackKey) || s.includes(name);
              });

              const futuresItems = trackPositions.filter(p => p.type === "FUTURES");
              const callItems = trackPositions.filter(p => p.type === "CALL");
              const putItems = trackPositions.filter(p => p.type === "PUT");
              const totalItemsCount = futuresItems.length + callItems.length + putItems.length;

              return (
                <div key={name} style={{
                  backgroundColor: '#1E293B',
                  borderRadius: '12px',
                  border: `1px solid ${totalItemsCount > 0 ? color : '#334155'}`,
                  padding: '16px',
                  display: 'flex',
                  flexDirection: 'column',
                  gap: '12px',
                  boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1)',
                  minHeight: '340px'
                }}>
                  {/* 전략 헤더: 전략명 + 상태 배지 */}
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                      <span style={{ fontSize: '14px', fontWeight: 800, color: '#F8FAFC' }}>{name}</span>
                      <span style={{
                        fontSize: '9px', fontWeight: 800, padding: '2px 6px', borderRadius: '4px',
                        backgroundColor: badge.bg, color: badge.color, border: `1px solid ${badge.border}`,
                        fontFamily: 'monospace'
                      }}>
                        [{badge.label}]
                      </span>
                    </div>
                  </div>

                  {/* 실시간 누적 순손익 & 수수료 */}
                  <div style={{ backgroundColor: '#0F172A', padding: '10px 12px', borderRadius: '8px', border: '1px solid #334155', display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontFamily: 'monospace' }}>
                    <div>
                      <div style={{ fontSize: '9px', color: '#64748B' }}>NET PnL (순손익)</div>
                      <div style={{ fontSize: '14px', fontWeight: 800, color: pnl >= 0 ? '#10B981' : '#EF4444' }}>
                        {pnl >= 0 ? '+' : ''}{Math.round(pnl).toLocaleString('ko-KR')}원
                      </div>
                    </div>
                    <div style={{ textAlign: 'right' }}>
                      <div style={{ fontSize: '9px', color: '#64748B' }}>EST. FEE / GROSS</div>
                      <div style={{ fontSize: '10px', color: '#F59E0B' }}>
                        -{Math.round(estFee).toLocaleString('ko-KR')}원
                      </div>
                    </div>
                  </div>

                  {/* 수행 과정 설명 */}
                  <div style={{ fontSize: '11px', color: '#CBD5E1', fontFamily: 'monospace', borderLeft: `3px solid ${color}`, paddingLeft: '8px', lineHeight: '1.4' }}>
                    {desc}
                  </div>

                  {/* 비중 게이지 바 */}
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '3px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '9px', fontFamily: 'monospace', color: '#64748B' }}>
                      <span>할당 비중</span>
                      <span style={{ color: color, fontWeight: 700 }}>{val}%</span>
                    </div>
                    <div style={{ width: '100%', height: '6px', backgroundColor: '#0F172A', borderRadius: '3px', overflow: 'hidden' }}>
                      <div style={{
                        width: `${val}%`, height: '100%', backgroundColor: color, borderRadius: '3px',
                        transition: 'width 0.3s ease-in-out'
                      }} />
                    </div>
                  </div>

                  {/* 📊 통합 실시간 포지션 매트릭스 구역 (FUTURES / CALL / PUT) */}
                  <div style={{
                    marginTop: 'auto',
                    backgroundColor: '#0F172A',
                    borderRadius: '8px',
                    border: '1px solid #334155',
                    padding: '8px',
                    display: 'flex',
                    flexDirection: 'column',
                    gap: '4px',
                    minHeight: '120px'
                  }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '10px', fontWeight: 700, color: '#38BDF8', fontFamily: 'monospace', borderBottom: '1px solid #1E293B', paddingBottom: '4px' }}>
                      <span>🛰️ LIVE POSITIONS</span>
                      <span style={{ fontSize: '9px', color: '#94A3B8' }}>{totalItemsCount}건</span>
                    </div>

                    {totalItemsCount > 0 ? (
                      <div style={{ display: 'flex', flex: 1 }}>
                        {renderMiniCol("FUTURES", futuresItems)}
                        {renderMiniCol("CALL", callItems)}
                        {renderMiniCol("PUT", putItems)}
                      </div>
                    ) : (
                      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 1, color: '#64748B', fontSize: '10px', fontFamily: 'monospace', padding: '16px 0' }}>
                        현재 보유 포지션 없음 (대기 중)
                      </div>
                    )}
                  </div>

                </div>
              );
            })}
          </div>
        </section>
      );
    });


    // 누적수익률 그래프를 위한 커스텀 툴팁 컴포넌트
    const CustomTooltip = ({ active, payload }) => {
      if (active && payload && payload.length) {
        const data = payload[0].payload;
        const profit = data.y;

        return (
          <div style={{
            backgroundColor: '#1E293B',
            border: '1px solid #4A5568',
            borderRadius: '8px',
            padding: '12px',
            color: '#F8FAFC',
            fontSize: '12px',
            fontFamily: 'monospace',
            boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.3)'
          }}>
            <p style={{ margin: '0 0 6px 0', color: '#94A3B8', fontWeight: 600 }}>[Tick #{data.x}]</p>
            <p style={{ margin: '0 0 8px 0', fontSize: '13px', fontWeight: 700, color: '#38BDF8' }}>
              총 자본금: {profit.toLocaleString('ko-KR')}원
            </p>

            {data.activeStrategy ? (
              <div style={{ borderTop: '1px solid #334155', paddingTop: '8px', marginTop: '4px', display: 'flex', flexDirection: 'column', gap: '3px' }}>
                <p style={{ margin: 0, color: '#F59E0B', fontWeight: 700 }}>⚡ [매매 체결 상황]</p>
                <p style={{ margin: 0 }}>전략명: <span style={{ color: '#818CF8', fontWeight: 600 }}>{data.activeStrategy}</span></p>
                <p style={{ margin: 0 }}>
                  구분: <span style={{ color: data.type === 'BUY' ? '#EF4444' : '#3B82F6', fontWeight: 600 }}>{data.type} ({data.assetType})</span>
                </p>
                <p style={{ margin: 0 }}>가격: {data.price} | 수량: {data.qty}</p>
                <p style={{ margin: 0, color: '#94A3B8' }}>시간: {data.time} | 상태: <span style={{ color: data.status === 'FILLED' ? '#10B981' : '#EF4444' }}>{data.status}</span></p>
                {data.fee > 0 && <p style={{ margin: 0, color: '#EF4444' }}>수수료: -₩{data.fee.toLocaleString()}</p>}
              </div>
            ) : (
              <div style={{ borderTop: '1px solid #334155', paddingTop: '6px', marginTop: '4px', color: '#64748B' }}>
                💡 [포지션 유지 / 평온 상태]
              </div>
            )}
          </div>
        );
      }
      return null;
    };

    // 매매 발생 지점을 위한 커스텀 마커 닷 컴포넌트
    const CustomDot = (props) => {
      const { cx, cy, payload, focusedTickSeq } = props;
      const isFocused = payload && payload.x === focusedTickSeq;
      if (isFocused) {
        return (
          <circle cx={cx} cy={cy} r={7.5} fill="#EC4899" stroke="#FFF" strokeWidth={2.5} style={{ filter: 'drop-shadow(0 0 8px #EC4899)', cursor: 'pointer' }} />
        );
      } else if (payload && payload.activeStrategy) {
        return (
          <circle cx={cx} cy={cy} r={4.5} fill="#EC4899" stroke="#FFF" strokeWidth={1.5} style={{ filter: 'drop-shadow(0 0 3px #EC4899)', cursor: 'pointer' }} />
        );
      }
      return null;
    };

    // ==============================================================================
    // 2. 수익률 추이 차트 컴포넌트
    // ==============================================================================
    const ProfitChart = memo(({ coords, focusedTickSeq }) => {
      const clickedIndex = focusedTickSeq !== null ? coords.findIndex(c => c.x === focusedTickSeq) : undefined;
      return (
        <div style={{ width: '100%', height: '300px', position: 'relative', overflow: 'hidden' }}>
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={coords} activeTooltipIndex={clickedIndex} margin={{ top: 25, right: 25, left: 10, bottom: 20 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#2D3748" opacity={0.3} />
              <XAxis
                dataKey="date"
                stroke="#94A3B8"
                tickLine={false}
                axisLine={{ stroke: '#334155' }}
                tick={{ fontSize: 11, fill: '#94A3B8' }}
                minTickGap={65}
                tickFormatter={(val) => {
                  if (!val) return '';
                  return val.length >= 10 ? val.slice(5) : val;
                }}
              />
              <YAxis
                width={95}
                domain={['dataMin - 1500000', 'dataMax + 1500000']}
                stroke="#A0AEC0"
                tickLine={false}
                axisLine={false}
                tickFormatter={(v) => {
                  const rounded = Math.round(v / 100000) * 100000;
                  return rounded.toLocaleString('ko-KR');
                }}
                tick={{ fontSize: 10, fill: '#A0AEC0', textAnchor: 'start', dx: -90, dy: -12 }}
              />
              <Tooltip content={<CustomTooltip />} />
              <Line type="monotone" dataKey="y" stroke="#818CF8" strokeWidth={2} dot={<CustomDot focusedTickSeq={focusedTickSeq} />} isAnimationActive={false} />
            </LineChart>
          </ResponsiveContainer>
        </div>
      );
    });


    // ==============================================================================
    // 3. 파생상품 페이오프 다이어그램 컴포넌트
    // ==============================================================================
    const PayoffDiagram = memo(({ payoffCoords, currentPrice }) => {
      const xDomain = [currentPrice - 20, currentPrice + 20];
      return (
        <div style={{ width: '100%', height: '260px', position: 'relative' }}>
          <ResponsiveContainer width="100%" height="100%">
            <ScatterChart margin={{ top: 10, right: 10, left: 15, bottom: 0 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#2D3748" opacity={0.3} />
              <XAxis type="number" dataKey="x" name="Index" domain={xDomain} stroke="#A0AEC0" tick={{ fontSize: 11, fill: '#A0AEC0' }} />
              <YAxis
                type="number"
                dataKey="y"
                name="PnL"
                domain={['auto', 'auto']}
                stroke="#A0AEC0"
                width={85}
                tickFormatter={(v) => {
                  if (Math.abs(v) >= 10000) {

    // ==============================================================================
    // 3-B. 합성 포트폴리오 만기 손익 다이어그램 (신설 전용 패널 - 극외가~극내가 전구간)
    // ==============================================================================
    const SyntheticPayoffDiagram = memo(({ payoffCoords, currentPrice }) => {
      if (!payoffCoords || payoffCoords.length === 0) {
        return <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#64748B' }}>포지션 데이터 대기 중...</div>;
      }

      // Y축 동적 범위 (20% 여백 자동 추가)
      const yValues = payoffCoords.map(p => p.y);
      const yMin = Math.min(...yValues);
      const yMax = Math.max(...yValues);
      const yPad = Math.max(Math.abs(yMax - yMin) * 0.18, 200000);
      const yDomain = [Math.floor(yMin - yPad), Math.ceil(yMax + yPad)];

      // X축 전체 범위 (패킷에서 수신한 payoffCoords 그대로 활용)
      const xValues = payoffCoords.map(p => p.x);
      const xMin = Math.min(...xValues);
      const xMax = Math.max(...xValues);

      // 현재가와 가장 가까운 포지션의 PnL 계산 (툴팁 표시용)
      const closestPoint = payoffCoords.reduce((prev, curr) =>
        Math.abs(curr.x - currentPrice) < Math.abs(prev.x - currentPrice) ? curr : prev, payoffCoords[0]);

      return (
        <div style={{ width: '100%', height: '300px', position: 'relative' }}>
          {/* 현재가 기준 손익 요약 */}
          <div style={{
            position: 'absolute', top: 0, right: 12, zIndex: 10,
            backgroundColor: closestPoint.y >= 0 ? 'rgba(16,185,129,0.15)' : 'rgba(239,68,68,0.15)',
            border: `1px solid ${closestPoint.y >= 0 ? '#10B981' : '#EF4444'}`,
            borderRadius: '8px', padding: '4px 10px',
            fontSize: '12px', fontFamily: 'monospace', fontWeight: 700,
            color: closestPoint.y >= 0 ? '#10B981' : '#EF4444'
          }}>
            현재가 기준 만기손익: {closestPoint.y >= 0 ? '+' : ''}{closestPoint.y.toLocaleString('ko-KR')}원
          </div>

          <ResponsiveContainer width="100%" height="100%">
            <ScatterChart margin={{ top: 28, right: 20, left: 10, bottom: 20 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#2D3748" opacity={0.3} />
              <XAxis
                type="number"
                dataKey="x"
                name="행사가"
                domain={[xMin, xMax]}
                stroke="#A0AEC0"
                tick={{ fontSize: 11, fill: '#A0AEC0' }}
                label={{ value: '← Deep OTM     행사가 (Strike Price)     Deep ITM →', position: 'insideBottom', offset: -10, fill: '#64748B', fontSize: 11 }}
                tickCount={10}
              />
              <YAxis
                type="number"
                dataKey="y"
                name="만기손익"
                domain={yDomain}
                stroke="#A0AEC0"
                width={90}

    // ==============================================================================
    // 4.5. 🚀 [MASTER UI DIRECTIVE] Universal Net Payoff & Auto-Scaling Dashboard Widget
    // ==============================================================================
    const PayoffWidget = memo(({ currentPrice, activeStrategy, portfolioOptions, futuresQty, frictionCost }) => {
      const canvasRef = useRef(null);
      const [anchorPrice, setAnchorPrice] = useState(null);

      // 1) 초기 원점 고정 및 Smart Re-centering
      useEffect(() => {
        if (!currentPrice) return;
        if (!anchorPrice) {
          setAnchorPrice(currentPrice);
        } else {
          // 지수가 화면을 크게 벗어날 경우 재정렬 (예: 10포인트 이상)
          if (Math.abs(currentPrice - anchorPrice) > 10) {
            setAnchorPrice(currentPrice);
          }
        }
      }, [currentPrice, anchorPrice]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas || !anchorPrice) return;
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        // Auto-Scaling: 기본 좌우 12.5pt (5호가)
        const range = 12.5;
        const xMin = anchorPrice - range;
        const xMax = anchorPrice + range;

        const MULTIPLIER = 250000;

        // 가격(x)에 따른 순손익(Net Payoff) 계산 함수
        const calcNetPayoff = (price) => {
          let payoff = 0;

          // 1. 옵션 포지션 합산
          (portfolioOptions || []).forEach(pos => {
            const strike = parseFloat(pos.strike);
            const qty = parseInt(pos.qty);
            const entryPrice = parseFloat(pos.avg_price || pos.price || 0); // 평단가
            if (isNaN(strike) || isNaN(qty)) return;

            let intrinsic = 0;
            if (pos.type === 'CALL' || pos.type === 'C') {
              intrinsic = Math.max(0, price - strike);
            } else if (pos.type === 'PUT' || pos.type === 'P') {
              intrinsic = Math.max(0, strike - price);
            }

            // 매수/매도 방향에 따른 부호 처리
            let finalQty = qty;
            if (pos.side === 'SELL' || pos.side === 'S' || pos.position === 'SELL') {
              finalQty = -qty;
            }

            payoff += (intrinsic - entryPrice) * finalQty * MULTIPLIER;
          });

          // 2. 선물 포지션 합산 (델타 헷징 및 감마 스캘핑용)
          // [PATCH] 옵션 순수 구조(페이오프) 시각적 안정화를 위해 선물 선형 델타는 합산에서 제외 (차트 춤춤 방지)
          /* 
          if (futuresQty && futuresQty !== 0) {
            const fQty = parseInt(futuresQty);
            payoff += (price - anchorPrice) * fQty * MULTIPLIER; 
          }
          */

          // 3. 마찰비용(Friction Cost) 차감 -> Downward Shift
          payoff -= (frictionCost || 0);
          return payoff;
        };

        // Y축 스케일링을 위해 범위 내 최대/최소 페이오프 계산
        let maxPayoff = -Infinity;
        let minPayoff = Infinity;
        for (let p = xMin; p <= xMax; p += 0.5) {
          const val = calcNetPayoff(p);
          if (val > maxPayoff) maxPayoff = val;
          if (val < minPayoff) minPayoff = val;
        }

        // 여백 확보 및 오토 스케일링
        const paddingY = Math.max(1000000, (maxPayoff - minPayoff) * 0.2);
        const yMax = maxPayoff + paddingY;
        const yMin = Math.min(-1000000, minPayoff - paddingY);

        const getX = (price) => ((price - xMin) / (xMax - xMin)) * width;
        const getY = (pnl) => height - (((pnl - yMin) / (yMax - yMin)) * height);

        ctx.clearRect(0, 0, width, height);

        // 배경 그리드 (X축/Y축)
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;

        // Zero Net Payoff 선 (0원)
        ctx.beginPath();
        const zeroY = getY(0);
        ctx.moveTo(0, zeroY);
        ctx.lineTo(width, zeroY);
        ctx.stroke();

        // 현재 지수 선 (세로선)
        const currentX = getX(currentPrice);
        ctx.strokeStyle = '#38BDF8'; // Light Blue
        ctx.beginPath();
        ctx.moveTo(currentX, 0);
        ctx.lineTo(currentX, height);
        ctx.stroke();

        // 페이오프 곡선 그리기
        ctx.beginPath();
        ctx.strokeStyle = '#F59E0B'; // 주황색 (페이오프)
        ctx.lineWidth = 2.5;
        for (let p = xMin; p <= xMax; p += 0.1) {
          const px = getX(p);
          const py = getY(calcNetPayoff(p));
          if (p === xMin) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // 텍스트 라벨 (현재 지수, 중심축)
        ctx.fillStyle = '#E2E8F0';
        ctx.font = '12px monospace';
        ctx.fillText(`Anchor: ${anchorPrice.toFixed(2)}`, 10, 20);
        ctx.fillStyle = '#38BDF8';
        ctx.fillText(`Curr: ${currentPrice.toFixed(2)}`, currentX + 5, 20);

      }, [currentPrice, anchorPrice, portfolioOptions, futuresQty, frictionCost, activeStrategy]);

      return (
        <section style={{
          backgroundColor: '#1E293B',
          borderRadius: '16px',
          border: '1px solid #334155',
          padding: '24px',
          boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1)',
          height: '320px',
          display: 'flex',
          flexDirection: 'column'
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
            <h2 style={{ fontSize: '18px', fontWeight: 'bold', color: '#E2E8F0', margin: 0 }}>
              Universal Net Payoff Widget
            </h2>
            <div style={{ fontSize: '12px', padding: '4px 8px', borderRadius: '4px', backgroundColor: '#0F172A', color: '#10B981' }}>
              {activeStrategy}
            </div>
          </div>
          <div style={{ flex: 1, position: 'relative', overflow: 'hidden' }}>
            <canvas
              ref={canvasRef}
              width={600}
              height={220}
              style={{ width: '100%', height: '100%' }}
            />
          </div>
        </section>
      );
    });

    // ==============================================================================

    // ==============================================================================
    // ==============================================================================
    // 4.5 Trade Replay & Decision Analyzer (매매 리플레이 및 의사결정 분석기) 컴포넌트

    // ==============================================================================

          flexDirection: 'column',
          gap: '16px'

    // ==============================================================================
    // 5. 대시보드 통합 메인 레이아웃 컴포넌트 (초대형 국면 배지 및 호가공백 연출 추가)
    // ==============================================================================
    const Dashboard = () => {
      const [isConnected, setIsConnected] = useState(false);
      // 내부 가상 시간을 Date 객체로 통합 관리하여 프론트엔드 자체 자율 타이머 구동
      const [virtualDateTime, setVirtualDateTime] = useState(new Date("2025-01-01T09:00:00"));
      const [regime, setRegime] = useState('NEUTRAL');
      const [bidAskSpread, setBidAskSpread] = useState(0.05); // 🛡️ 호가공백 상태
      const [coords, setCoords] = useState([]);
      const [payoffCoords, setPayoffCoords] = useState([]);
      const [orders, setOrders] = useState([]);
      const [seq, setSeq] = useState(0);
      const [currentPrice, setCurrentPrice] = useState(350);
      const [capital, setCapital] = useState(25000000);
      const [reserve, setReserve] = useState(0);
      const [budgetPool, setBudgetPool] = useState(0);
      const [stressMode, setStressMode] = useState(false);
      const [hardenedMode, setHardenedMode] = useState(false);
      const [slippageMs, setSlippageMs] = useState(50);
      const [slippageRate, setSlippageRate] = useState(0.001);
      const [usedMargin, setUsedMargin] = useState(0);
      const [marginRatio, setMarginRatio] = useState(0);
      const [riskLevel, setRiskLevel] = useState('NORMAL');
      const [activeStrategy, setActiveStrategy] = useState('Track1 (Defense)');
      const [tuningFactor, setTuningFactor] = useState(1.0);
      const [daysToExpiry, setDaysToExpiry] = useState(7.0);
      const [autobotActive, setAutobotActive] = useState(false);

      // 📅 [신규 추가] 가상 테스트 시작/종료 일시 및 경과 시간 상태
      const [testStartDateTime, setTestStartDateTime] = useState('');
      const [testEndDateTime, setTestEndDateTime] = useState('');
      const [realElapsedSecs, setRealElapsedSecs] = useState(0);
      const [focusedTickSeq, setFocusedTickSeq] = useState(null);
      const [portfolioOptions, setPortfolioOptions] = useState([]);
      const [futuresQty, setFuturesQty] = useState(0);
      const [frictionCost, setFrictionCost] = useState(0);
      const [eventLogs, setEventLogs] = useState([]);
      const [strategyPnL, setStrategyPnL] = useState({});
      const [tradeReplayList, setTradeReplayList] = useState([]);
      const [tradeTreeArchive, setTradeTreeArchive] = useState({});
      const [selectedReplayTrade, setSelectedReplayTrade] = useState(null);



      // 가상 테스트의 소요시간 계산 함수
      const getVirtualElapsedSecs = () => {
        if (!testStartDateTime) return 0;
        const startDt = new Date(testStartDateTime.replace(' ', 'T'));
        if (isNaN(startDt.getTime())) return 0;
        const diffMs = virtualDateTime.getTime() - startDt.getTime();
        return Math.max(0, Math.floor(diffMs / 1000));
      };

      const [activeScenarios, setActiveScenarios] = useState({
        circuitBreaker: false,
        flashCrash: false,
        ivExplosion: false,
        rejectionStorm: false,
        liquidityDrought: false,
        ivSellBlocked: false
      });

      const [strategyWeights, setStrategyWeights] = useState({
        "Track1 (Defense)": 30.0,
        "Track2 (Trap)": 0.0,
        "Track3 (Arbitrage)": 0.0,
        "Track4 (Gamma)": 0.0,
        "Track5 (Gap)": 0.0,
        "Track6 (Daily)": 0.0,
        "Track7 (Weekly)": 0.0,
        "Track8 (Monthly)": 0.0
      });

      const [hourlyReturn, setHourlyReturn] = useState(0.0);
      const [monthlyReturn, setMonthlyReturn] = useState(0.0);

      const [enabledStrategies, setEnabledStrategies] = useState({
        track1: true, track2: true, track3: true, track4: true,
        track5: true, track6: true, track7: true, track8: true
      });

      const currentSessionIdRef = useRef(null);
      const reconnectCount = useRef(0);
      const wsRef = useRef(null);

      const handleToggleStrategy = useCallback((trackId, newState) => {
        setEnabledStrategies(prev => {
          const updated = { ...prev, [trackId]: newState };
          if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
            wsRef.current.send(JSON.stringify({
              action: "update_strategy_flags",
              enabled_strategies: updated
            }));
          }
          return updated;
        });
      }, []);

      const handleStartBot = useCallback(() => {
        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
          wsRef.current.send(JSON.stringify({ action: "start_bot" }));
        }
      }, []);

      const connect = useCallback(() => {
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        let host = window.location.host;
        if (!host || host === 'localhost' || host.includes('3000') || host.includes('8082')) {
          host = 'localhost:8080';
        }
        const wsUrl = `${wsProtocol}//${host}`;
        const ws = new WebSocket(wsUrl);
        wsRef.current = ws;

        ws.onopen = () => {
          setIsConnected(true);
          reconnectCount.current = 0;
        };

        ws.onmessage = (event) => {
          try {
            const parsedData = JSON.parse(event.data);
            if (!parsedData || typeof parsedData !== 'object') return;

            // 0-1. 🛡️ [Phase 3.1] 세션 경계 감지 및 상태 리셋
            if (parsedData.sessionId && parsedData.sessionId !== currentSessionIdRef.current) {
              console.warn(`[SESSION CHANGE] 새 세션 감지 (${parsedData.sessionId}), 로컬 상태 초기화`);
              currentSessionIdRef.current = parsedData.sessionId;
              setCoords([]);
              if (typeof setPortfolioOptions === 'function') setPortfolioOptions([]);
            }

            // 0-2. 날짜 및 시간 수신
            if (parsedData.date && parsedData.time) {
              const newDt = new Date(`${parsedData.date}T${parsedData.time}`);
              if (!isNaN(newDt.getTime())) {
                setVirtualDateTime(newDt);
              }
            }

            // 1. 가격 (🛡️ [Phase 3.2] 가격 falsy 값 안전 처리)
            const priceVal = parsedData.underlyingPrice ?? parsedData.price;
            if (priceVal !== undefined && priceVal !== null) {
              setCurrentPrice(priceVal);
            }

            // 2. 국면
            if (parsedData.regime) {
              setRegime(parsedData.regime);
            }

            // 3. 🛡️ 호가공백(스프레드) 수신
            if (parsedData.bidAskSpread !== undefined) {
              setBidAskSpread(parsedData.bidAskSpread);
            }

            // 4. Coords
            if (parsedData.coord) {
              setCoords((prev) => [...prev, parsedData.coord].slice(-MAX_POINTS));
              if (parsedData.coord.x !== undefined) {
                setSeq(parsedData.coord.x);
              }
            }

            // 5. Payoff
            if (parsedData.payoffCoords) {
              setPayoffCoords(parsedData.payoffCoords);
            }

            // 6. Orders
            if (parsedData.order && parsedData.order.id) {
              setOrders((prev) => [parsedData.order, ...prev].slice(0, MAX_ORDERS));
            } else if (Array.isArray(parsedData.orders)) {
              setOrders((prev) => [...parsedData.orders, ...prev].slice(0, MAX_ORDERS));
            }

            // 7. 전략 가중치
            // 7. 전략 가중치
            if (parsedData.strategyWeights) {
              setStrategyWeights(parsedData.strategyWeights);
            }
            if (parsedData.autobotActive !== undefined) {
              setAutobotActive(parsedData.autobotActive);
            }

            // 8. 🛡️ 자본금 및 유보금 수신
            if (parsedData.capital !== undefined) {
              setCapital(parsedData.capital);

                  <span style={{ fontSize: '9px', color: '#475569' }}>주문 지연 강제 주입</span>
                  <input type="range" min="0" max="350" step="50" value={slippageMs} onChange={e => setSlippageMs(+e.target.value)} style={{ width: '100%', accentColor: '#3B82F6', cursor: 'pointer' }} />
                  <span style={{ fontSize: '12px', fontWeight: 800, color: slippageMs > 0 ? '#60A5FA' : '#475569', fontFamily: 'monospace', textAlign: 'center' }}>{slippageMs === 0 ? 'OFF' : `${slippageMs}ms`}</span>
                </div>
              </div>
              <button onClick={sendSettings} style={{ width: '100%', padding: '15px 0', borderRadius: '12px', cursor: 'pointer', border: 'none', background: applied ? 'linear-gradient(90deg,#059669,#10B981)' : 'linear-gradient(135deg,#4F46E5,#7C3AED)', color: '#FFF', fontSize: '14px', fontWeight: 800, letterSpacing: '0.05em', transition: 'all 0.3s', boxShadow: applied ? '0 0 24px rgba(16,185,129,0.45)' : '0 0 24px rgba(79,70,229,0.45)' }}>
                {applied ? '✅ 시뮬레이션에 반영됨!' : '⚡ 즉시 적용 (실시간 반영)'}
              </button>
            </div>
          </div>
        </section>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Dashboard />);
  </script>
</body>

</html>
