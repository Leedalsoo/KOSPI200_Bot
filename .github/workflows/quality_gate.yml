name: Supreme Court Quality Gate (Auto)
on: [push, pull_request]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Ruff (초고속 안티패턴 검열)
        run: ruff check .
      - name: Run Mypy (타입 스캔)
        run: mypy . --ignore-missing-imports
        continue-on-error: true
      - name: Run Pytest (HFT 엣지 케이스 단위 테스트 및 8단계 전용 검증)
        run: pytest tests/unit/ tests/src/ -v
      - name: Run Chaos Monkey Test (결함 주입 내성 검증)
        run: CHAOS_MODE=1 pytest tests/chaos/ -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Frontend Dependencies
        run: |
          cd web_interface
          npm install
          chmod -R +x node_modules/.bin || true
      - name: Run Frontend Lint (ESLint 검증)
        run: |
          cd web_interface
          npm run lint
      - name: Run Frontend Tests (React Hooks 단위 테스트)
        env:
          CI: true
        run: |
          cd web_interface
          npm run test
      - name: Update Commit Combined Status (Quality Gate PASS)
        if: success()
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state": "success", "target_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "description": "Supreme Court Quality Gate Passed", "context": "Quality Gate / Combined Status"}'
      - name: Update Commit Combined Status (Quality Gate FAIL)
        if: failure()
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state": "failure", "target_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "description": "Supreme Court Quality Gate Failed", "context": "Quality Gate / Combined Status"}'
