name: Supreme Court Quality Gate (Auto)
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Ruff (초고속 안티패턴 검열)
        run: ruff check .
      - name: Run Mypy (엄격한 타입 스캔)
        run: mypy . --strict
      - name: Run Pytest (HFT 엣지 케이스 단위 테스트)
        run: pytest tests/unit/ -v
      - name: Run Chaos Monkey Test (결함 주입 내성 검증)
        run: CHAOS_MODE=1 pytest tests/chaos/ -v
