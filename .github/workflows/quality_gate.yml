name: Supreme Court Quality Gate (Auto)
on: [push, pull_request]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Ruff (초고속 안티패턴 검열)
        run: ruff check .
      - name: Run Mypy (타입 스캔)
        run: mypy . --ignore-missing-imports
        continue-on-error: true
      - name: Run Pytest (HFT 엣지 케이스 단위 테스트)
        run: pytest tests/unit/ -v
      - name: Run Chaos Monkey Test (결함 주입 내성 검증)
        run: CHAOS_MODE=1 pytest tests/chaos/ -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Frontend Dependencies
        run: |
          cd web_interface
          npm install
          chmod -R +x node_modules/.bin || true
      - name: Run Frontend Lint (ESLint 검증)
        run: |
          cd web_interface
          npm run lint
      - name: Run Frontend Tests (React Hooks 단위 테스트)
        env:
          CI: true
        run: |
          cd web_interface
          npm run test

