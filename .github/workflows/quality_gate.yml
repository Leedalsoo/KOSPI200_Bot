name: Supreme Court Quality Gate (Auto)
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Ruff (초고속 안티패턴 검열)
        run: ruff check .
      - name: Run Mypy (타입 스캔)
        run: mypy . --ignore-missing-imports
        continue-on-error: true
      - name: Run Pytest (HFT 엣지 케이스 단위 테스트)
        run: pytest tests/unit/ --ignore=tests/unit/test_strategy_plugins_track1_defense.py --ignore=tests/unit/test_strategy_plugins_track2_trap.py --ignore=tests/unit/test_strategy_plugins_track4_gamma.py --ignore=tests/unit/test_strategy_plugins_track3_arbitrage.py -v
      - name: Run Chaos Monkey Test (결함 주입 내성 검증)
        run: CHAOS_MODE=1 pytest tests/chaos/ -v
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Frontend Dependencies
        run: |
          cd web_interface
          npm install --ignore-scripts
          chmod -R +x node_modules/.bin || true
      - name: Run Frontend Lint (ESLint 검증)
        run: |
          cd web_interface
          npm run lint
      - name: Run Frontend Tests (React Hooks 단위 테스트)
        env:
          CI: true
        run: |
          cd web_interface
          npm run test

