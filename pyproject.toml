[tool.ruff]
target-version = "py311"
exclude = [
    ".git",
    "venv",
    "node_modules",
    "scratch",
    "mock_ws_server_refactored.py",
]

[tool.ruff.lint]
# Ignore minor style rules like import sorting (I), line length (E501), and trailing whitespace (W291-293)
ignore = ["I", "E501", "F401", "F841", "W291", "W292", "W293"]
select = ["E", "F", "W"]

[tool.mypy]
ignore_missing_imports = true
exclude = [
    "venv",
    "node_modules",
    "scratch",
    "mock_ws_server_refactored.py",
]
